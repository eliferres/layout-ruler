<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>layout-ruler fixture: pricing tiers uneven</title>
<style>
  body { margin: 0; padding: 24px; font: 16px/24px Helvetica, Arial, sans-serif; color: #1f2430; }
  .tiers { display: flex; gap: 24px; }
  .tier { flex: none; width: 300px; box-sizing: border-box; border: 1px solid #ccc; padding: 16px; }
  .tier:nth-child(2) { width: 276px; }
  .tier h3 { margin: 0; font-size: 20px; line-height: 28px; }
  .tier p { margin: 8px 0 0; }
</style></head>
<body><div class="tiers">
<div class="tier"><h3>Starter</h3><p class="price">$9 a month</p><p class="note">One user</p></div>
<div class="tier"><h3>Team</h3><p class="price">$29 a month</p><p class="note">Ten users</p></div>
<div class="tier"><h3>Scale</h3><p class="price">$99 a month</p><p class="note">Unlimited</p></div>
</div></body>
</html>
