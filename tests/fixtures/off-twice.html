<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layout-ruler fixture: off twice</title>
<style>
  body { margin: 0; padding: 24px; font: 16px/24px Helvetica, Arial, sans-serif; color: #1f2430; }
  .list { list-style: none; margin: 0 0 24px; padding: 0; max-width: 640px; display: grid; grid-template-columns: auto auto 1fr auto; column-gap: 16px; }
  .row { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; align-items: center; padding: 12px 16px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c05a3c; }
  .tiles { display: flex; gap: 16px; margin-bottom: 24px; }
  .tile { width: 120px; height: 80px; background: #f3f1ec; }
  .tile:nth-child(2) { margin-top: 20px; }
  .tile:nth-child(3) { margin-top: 40px; }
</style>
</head>
<body>
  <ul class="list">
    <li class="row"><span class="name">Ada</span><span class="dot"></span><span class="status">Late</span><span class="value">$120</span></li>
    <li class="row"><span class="name">Second Customer Name</span><span class="dot"></span><span class="status">Sent</span><span class="value">$1,240</span></li>
    <li class="row"><span class="name">Client C</span><span class="dot"></span><span class="status">Paid</span><span class="value">$80</span></li>
  </ul>
  <div class="tiles" data-ruler="off"><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
  <div class="tiles" data-ruler="off"><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
</body>
</html>
