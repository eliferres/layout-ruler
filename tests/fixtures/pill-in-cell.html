<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>layout-ruler fixture: pill in cell</title>
<style>
body{margin:0;padding:24px;font:16px/24px Helvetica,Arial,sans-serif;color:#1f2430}
ul{list-style:none;margin:0;padding:0;max-width:640px;display:grid;grid-template-columns:auto auto 1fr;column-gap:16px}
li{display:grid;grid-template-columns:subgrid;grid-column:1/-1;align-items:center;padding:12px 16px}
.pill{display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:999px;background:#eef}
.dot{width:8px;height:8px;border-radius:50%;background:#c05a3c}
.v{text-align:right}
</style></head><body>
<ul>
<li><span class="name">Ada</span><span class="pill"><span class="dot"></span><span class="label">Late</span><span class="count">2</span></span><span class="v">$120</span></li>
<li><span class="name">Second Customer Name</span><span class="pill"><span class="dot"></span><span class="label">Sent</span><span class="count">14</span></span><span class="v">$1,240</span></li>
<li><span class="name">Client C</span><span class="pill"><span class="dot"></span><span class="label">Paid</span><span class="count">1</span></span><span class="v">$80</span></li>
<li><span class="name">Client D</span><span class="pill"><span class="dot"></span><span class="label">Late</span><span class="count">3</span></span><span class="v">$460</span></li>
</ul>
</body></html>
