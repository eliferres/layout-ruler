<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layout-ruler fixture: baseline off</title>
<style>
  body { margin: 0; padding: 24px; font: 16px/24px Helvetica, Arial, sans-serif; color: #1f2430; }
  .list { list-style: none; margin: 0; padding: 0; max-width: 640px; }
  .row { display: block; box-sizing: border-box; height: 48px; padding: 12px 16px; white-space: nowrap; font-size: 0; }
  .name, .value { display: inline-block; font-size: 16px; }
  .name { width: 240px; }
  .value { width: 80px; text-align: right; }
  .row:nth-child(3) .value { vertical-align: top; padding-top: 6px; }
</style>
</head>
<body>
  <ul class="list">
    <li class="row"><span class="name">Ada</span><span class="value">$120</span></li>
    <li class="row"><span class="name">Second Customer Name</span><span class="value">$1,240</span></li>
    <li class="row"><span class="name">Client C</span><span class="value">$80</span></li>
    <li class="row"><span class="name">Fourth Client Name</span><span class="value">$460</span></li>
    <li class="row"><span class="name">Eve</span><span class="value">$95</span></li>
  </ul>
</body>
</html>
