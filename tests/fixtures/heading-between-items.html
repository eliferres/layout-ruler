<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>layout-ruler fixture: heading between items</title>
<style>
body{margin:0;padding:24px;font:16px/24px Helvetica,Arial,sans-serif;color:#1f2430}
.list{max-width:640px}
.item{margin:0 0 16px;padding:12px 16px;border:1px solid #ccc}
.list h3{font-size:20px;line-height:28px;margin:40px 0 12px}
</style></head><body>
<div class="list">
<div class="item">Pick a folder</div>
<div class="item">Pick a theme</div>
<h3>Then</h3>
<div class="item">Tag every item</div>
<div class="item">Sorted on request</div>
</div>
</body></html>
