<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;margin:0;padding:0}body{font:16px/24px system-ui,sans-serif;padding:32px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}@media(max-width:600px){.cards{grid-template-columns:1fr}}
.card{border:1px solid #ccc;padding:16px}.card h3{font-size:18px;line-height:24px}
.statusline{margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:99px;background:#eee;font-size:13px;line-height:20px}
.dot{width:8px;height:8px;border-radius:50%;background:green}
.top{display:flex;align-items:center;gap:8px;margin:16px 0}
</style></head><body>

<div class=cards>
<div class=card><h3>Acme</h3><div class=statusline><div class=wrapline><span class=pill><span class=dot></span><span>Paid</span><span>2</span></span></div></div></div>
<div class=card><h3>Globex</h3><div class=statusline><div class=wrapline><span class=pill><span class=dot></span><span>Late</span><span>1</span></span></div></div></div>
<div class=card><h3>Initech</h3><div class=statusline><div class=wrapline><span class=pill><span class=dot></span><span>Due</span><span>4</span></span></div></div></div>
</div></body></html>
